# Configuration for berusky game (AmigaOS: the program's drawer)

# Game data location
level_data = PROGDIR:Levels
game_data = PROGDIR:GameData
graphics_data = PROGDIR:Graphics

# Graphics settings for game and editor
# game runs in 640x480
# editor runs in 1024x768
fullscreen = 0

# AmigaOS: 640x480 at the start, no question; "High resolution mode"
# in the menu doubles it to 1280x960 (heavy on a 68k)
startup_doublesize_question = 0
disable_double_size = 1
color_depth = 32

# Logging
log = 0
logfile = ~/.berusky/b1logfile.txt

# Game binary & tmp dir
# they're used by editor for "run level" command
game_binary = PROGDIR:Berusky
tmp_data = T:

# Dir for users levels (it's the default level dir for level editor)
level_data_user = ~/.berusky/User
